name: Dependency Risk Observability

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-risk-observability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency review severity policy (high+)
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high

      - name: Emit warning when policy threshold is exceeded
        if: steps.dependency_review.outcome != 'success'
        run: |
          echo "::warning::Dependency review detected vulnerabilities at or above HIGH severity (warning-only policy)."

  vulnerability-snapshot:
    name: Vulnerability Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run warning-only pre-build security gate
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File ./scripts/security/Invoke-CiPreBuildSecuritySnapshot.ps1 `
            -RepoRoot $PWD `
            -WarningOnly:$true `
            -AllowMissingCargoAudit

      - name: Upload vulnerability snapshot artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-snapshot-${{ github.run_id }}
          path: |
            .temp/vulnerability-audit/
          if-no-files-found: warn
          retention-days: 14